# Sources RSS / Atom pour la veille Outils de gestion de crise et de PC.
# Presse nationale : config/sources_presse.yaml
# Presse régionale France entière : config/sources_crise_territoires.yaml
# Presse informatique / technique / IA : config/sources_tech.yaml
# Réseaux sociaux : requetes_rs + config/reseaux_sociaux.yaml

google_news:
  - id: gn-outils-crise-fr
    label: Google News — Outils de gestion de crise (français)
    query: '"outil de gestion de crise" OR "logiciel de gestion de crise" OR "système d''information de crise" OR SYNERGI OR NexSIS OR "main courante numérique"'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: outils_crise
  - id: gn-outils-crise-en
    label: Google News — Crisis management software
    query: '"crisis management software" OR "emergency management platform" OR WebEOC OR Everbridge OR "emergency operations center"'
    hl: en-US
    gl: US
    ceid: US:en
    domaine: outils_crise
  - id: gn-poste-commandement
    label: Google News — Poste de commandement
    query: '"poste de commandement" OR PCO OR "salle de crise" OR "PC de crise" OR "centre opérationnel départemental"'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: poste_commandement
  - id: gn-main-courante
    label: Google News — Main courante
    query: '"main courante" OR "main courante numérique" OR "main courante électronique"'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: main_courante
  - id: gn-orsec-nexsis
    label: Google News — ORSEC / NexSIS / SYNERGI
    query: 'ORSEC OR NexSIS OR SYNERGI OR COGIC OR CODIS OR "plan communal de sauvegarde"'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: systemes_orsec
  - id: gn-editeurs-crise
    label: Google News — Éditeurs (Everbridge, Hexagon, Systel…)
    query: 'Everbridge OR WebEOC OR Juvare OR "Hexagon Safety" OR Systel OR Veoci OR Noggin OR AtHoc'
    hl: en-US
    gl: US
    ceid: US:en
    domaine: editeurs
  - id: gn-gazette-localtis
    label: Google News — Gazette / Localtis
    query: 'site:lagazettedescommunes.com OR site:banquedesterritoires.fr ("gestion de crise" OR "poste de commandement" OR "main courante" OR NexSIS OR ORSEC)'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    site: https://www.lagazettedescommunes.com/

requetes_rs:
  - id: outils-fr
    label: Outils PC / crise (français)
    query: '"gestion de crise" OR "poste de commandement" OR "main courante" OR NexSIS OR SYNERGI OR ORSEC OR "salle de crise"'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
  - id: outils-en
    label: Crisis tools (anglais)
    query: '"crisis management software" OR "emergency operations center" OR WebEOC OR Everbridge OR "common operational picture"'
    hl: en-US
    gl: US
    ceid: US:en
    filtre: mots_cles
  - id: li-outils-logiciels
    label: logiciels / SIC
    reseaux: [linkedin]
    query: '"logiciel de gestion de crise" OR "outil de gestion de crise" OR "système d''information de crise" OR "tableau de bord de crise" OR "aide à la décision de crise"'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    domaine: outils_crise
  - id: li-outils-pc
    label: poste de commandement
    reseaux: [linkedin]
    query: '"poste de commandement" OR "salle de crise" OR "PC de crise" OR PCO OR PCC OR "PC opérationnel" OR "centre opérationnel"'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    domaine: poste_commandement
  - id: li-outils-main-courante
    label: main courante
    reseaux: [linkedin]
    query: '"main courante" OR "main courante numérique" OR "main courante électronique"'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    domaine: main_courante
  - id: li-outils-orsec
    label: NexSIS / SYNERGI / ORSEC
    reseaux: [linkedin]
    query: 'NexSIS OR SYNERGI OR ORSEC OR COGIC OR CODIS OR ANTARES OR SITAC OR "18-112" OR "plan communal de sauvegarde"'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    domaine: systemes_orsec
  - id: li-outils-editeurs-fr
    label: éditeurs FR
    reseaux: [linkedin]
    query: 'Systel OR Anticip OR "IWS crise" OR "Hexagon Safety" OR Intergraph'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    domaine: editeurs
  - id: li-outils-software
    label: crisis software
    reseaux: [linkedin]
    query: '"crisis management software" OR "emergency management software" OR "emergency management platform" OR "crisis information system"'
    hl: en-US
    gl: US
    ceid: US:en
    filtre: mots_cles
    domaine: outils_crise
  - id: li-outils-eoc
    label: EOC / COP
    reseaux: [linkedin]
    query: '"emergency operations center" OR "common operational picture" OR WebEOC OR "incident management software"'
    hl: en-US
    gl: US
    ceid: US:en
    filtre: mots_cles
    domaine: poste_commandement
  - id: li-outils-editeurs-en
    label: éditeurs (Everbridge, Juvare…)
    reseaux: [linkedin]
    query: 'Everbridge OR Juvare OR Veoci OR Noggin OR AtHoc OR D4H OR Dataminr OR Crisis24 OR OnSolve OR AlertMedia'
    hl: en-US
    gl: US
    ceid: US:en
    filtre: mots_cles
    domaine: editeurs

