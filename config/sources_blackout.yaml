# Sources de la veille Black-out (France).
# Presse nationale, AURA, informatique : config/sources_presse.yaml, sources_tech.yaml, sources_auto.yaml.
# Presse régionale France entière : config/sources_crise_territoires.yaml (profil).
# Les sites d'État sans RSS public sont interrogés via Google News (site:…).

google_news:
  - id: gn-bl-macron
    label: Google News — Macron, black-out et électricité
    query: '("Emmanuel Macron" OR "président Macron") (blackout OR "black-out" OR "black out" OR délestage OR "panne géante" OR EcoWatt OR "coupure d''électricité" OR "exercice black-out" OR SGDSN OR CIRN)'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    site: https://www.elysee.fr/
  - id: gn-bl-macron-energie
    label: Google News — Macron et la crise énergétique
    query: '("Emmanuel Macron") (énergie OR électricité OR carburant OR carburants OR "prix du gaz" OR Ormuz OR "stocks stratégiques" OR résilience OR blackout OR "black-out" OR délestage)'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: aucun
    domaine: crise_energetique
    site: https://www.elysee.fr/
  - id: gn-bl-elysee
    label: Élysée — énergie, électricité, résilience
    query: 'site:elysee.fr (blackout OR "black-out" OR délestage OR électricité OR "réseau électrique" OR "résilience nationale" OR carburant OR Ormuz OR EcoWatt OR "crise énergétique")'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    site: https://www.elysee.fr/
  - id: gn-bl-etat
    label: Google News — services de l'État
    query: '(site:sgdsn.gouv.fr OR site:gouvernement.fr OR site:info.gouv.fr OR site:vie-publique.fr OR site:service-public.fr OR site:interieur.gouv.fr OR site:ecologie.gouv.fr OR site:economie.gouv.fr) (blackout OR "black-out" OR délestage OR "panne géante" OR "résilience nationale" OR CIRN OR "Tous résilients" OR "coupure d''électricité" OR "système électrique")'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    site: https://www.sgdsn.gouv.fr/
  - id: gn-bl-parlement
    label: Google News — Parlement, Vie publique, Cour des comptes
    query: '(site:senat.fr OR site:assemblee-nationale.fr OR site:ccomptes.fr OR site:vie-publique.fr OR site:legifrance.gouv.fr) (blackout OR "black-out" OR délestage OR "résilience nationale" OR "système électrique" OR "sécurité d''approvisionnement" OR EcoWatt)'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    site: https://www.vie-publique.fr/
  - id: gn-bl-operateurs
    label: Google News — RTE, Enedis, EcoWatt, CRE
    query: '(site:rte-france.com OR site:enedis.fr OR site:monecowatt.fr OR site:cre.fr) (blackout OR "black-out" OR délestage OR EcoWatt OR "risque de coupure" OR "sécurité d''approvisionnement" OR "équilibre" OR marges OR "système électrique")'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    site: https://www.rte-france.com/
  - id: gn-bl-france
    label: Google News — black-out en France
    query: '(blackout OR "black-out" OR "black out" OR "panne géante" OR "black-out électrique") (France OR français OR française OR RTE OR Enedis OR Macron OR SGDSN)'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    site: https://news.google.com/
  - id: gn-bl-delestage
    label: Google News — délestage et EcoWatt
    query: '(délestage OR "coupures tournantes" OR EcoWatt OR "signal EcoWatt" OR "plan de délestage") (France OR français OR RTE OR Enedis OR électrique)'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    site: https://www.monecowatt.fr/
  - id: gn-bl-menaces
    label: Google News — sabotage et cyberattaque du réseau
    query: '(sabotage OR cyberattaque) ("réseau électrique" OR "poste électrique" OR RTE OR Enedis) (France OR français OR européenne)'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    site: https://www.ssi.gouv.fr/
  - id: gn-bl-dossiers
    label: Google News — dossiers de presse
    query: '(dossier OR enquête OR décryptage) (blackout OR "black-out" OR "panne géante" OR délestage) (France OR français)'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    site: https://news.google.com/

