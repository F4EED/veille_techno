# Presse nationale et Auvergne-Rhône-Alpes, commune à toutes les veilles.
# filtre: mots_cles → seuls les articles qui matchent le fichier keywords du profil.

google_news:
  - id: gn-afp
    label: AFP
    query: 'site:afp.com OR site:agencetfrancepresse.com'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    site: https://www.afp.com/fr/
  - id: gn-lci-tf1
    label: LCI / TF1 Info
    query: 'site:lci.fr OR site:tf1info.fr'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    site: https://www.tf1info.fr/
  - id: gn-arte-lcp
    label: Arte / LCP / Public Sénat
    query: 'site:arte.tv OR site:lcp.fr OR site:publicsenat.fr'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    site: https://www.arte.tv/fr/
  - id: gn-rtl-echos
    label: RTL / Les Echos
    query: 'site:rtl.fr OR site:lesechos.fr'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    site: https://www.rtl.fr/
  - id: gn-presse-aura-pqr
    label: Google News — PQR Auvergne-Rhône-Alpes
    query: 'site:ledauphine.com OR site:leprogres.fr OR site:lamontagne.fr OR site:leveil.fr OR site:lemessager.fr OR site:lavoixdelain.fr OR site:zoomdici.fr'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    site: https://www.ledauphine.com/
  - id: gn-presse-aura-web
    label: Google News — médias web AURA
    query: 'site:lyoncapitale.fr OR site:lyonmag.com OR site:rue89lyon.fr OR site:placegrenet.fr OR site:tribunedelyon.fr OR site:zoomdici.fr OR site:mlyon.fr OR site:mesinfos.fr'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    site: https://www.lyoncapitale.fr/

