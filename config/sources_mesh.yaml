# Sources RSS / Atom pour la veille Mesh.
# Presse nationale et Auvergne-Rhône-Alpes : config/sources_presse.yaml
# Presse informatique / technique / IA / développement : config/sources_tech.yaml
# Découvertes de chaque lancement : config/sources_decouvertes_mesh.yaml
# et config/sources_auto.yaml (communes à toutes les veilles).
# reticulum.network et unsigned.io n'ont pas de flux RSS : Google News site:.

google_news:
  - id: gn-mesh-wifi
    label: Google News — Mesh Wi-Fi et réseaux maillés
    query: '"mesh wifi" OR "wifi mesh" OR "wi-fi mesh" OR "réseau mesh" OR "réseau maillé" OR "réseaux maillés" OR "wireless mesh" OR "802.11s" OR "batman-adv" OR Yggdrasil OR cjdns OR Reticulum OR "disaster radio"'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: general
  - id: gn-meshtastic
    label: Google News — Meshtastic
    query: 'Meshtastic'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: meshtastic
  - id: gn-meshtastic-en
    label: Google News — Meshtastic (anglais)
    query: 'Meshtastic'
    hl: en-US
    gl: US
    ceid: US:en
    domaine: meshtastic
  - id: gn-meshcore
    label: Google News — MeshCore
    query: 'MeshCore OR "Mesh Core" LoRa'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: meshcore
  - id: gn-meshcore-en
    label: Google News — MeshCore (anglais)
    query: 'MeshCore OR "Mesh Core" LoRa'
    hl: en-US
    gl: US
    ceid: US:en
    domaine: meshcore
  - id: gn-mesh-sites
    label: Google News — Meshtastic, MeshCore, Reticulum
    query: 'site:meshtastic.org OR site:meshcore.io OR site:blog.meshcore.io OR site:reticulum.network OR site:unsigned.io OR site:open-mesh.org'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: general

requetes_rs:
  - id: mesh-fr
    label: Mesh (français)
    query: 'Meshtastic OR MeshCore OR "mesh wifi" OR "wifi mesh" OR "réseau maillé" OR "réseau mesh" OR Reticulum OR "802.11s"'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
  - id: mesh-en
    label: Mesh (anglais)
    query: 'Meshtastic OR MeshCore OR "mesh wifi" OR "wifi mesh" OR "wireless mesh" OR Reticulum OR "802.11s" OR "batman-adv"'
    hl: en-US
    gl: US
    ceid: US:en
    filtre: mots_cles
  - id: li-meshtastic
    label: Meshtastic
    reseaux: [linkedin]
    query: 'Meshtastic OR "LoRa mesh" OR "mesh LoRa"'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    domaine: meshtastic
  - id: li-meshcore
    label: MeshCore
    reseaux: [linkedin]
    query: 'MeshCore OR "Mesh Core"'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    domaine: meshcore

mastodon_tags:
  - Meshtastic
  - MeshCore
  - Reticulum

