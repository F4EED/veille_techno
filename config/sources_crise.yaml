  - id: li-crise-inondations
    label: inondations
    reseaux: [linkedin]
    query: 'inondation OR crue OR submersion OR "flash flood" OR flooding OR "coulée de boue"'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    domaine: inondations
  - id: li-crise-seismes
    label: séismes
    reseaux: [linkedin]
    query: '"tremblement de terre" OR séisme OR earthquake OR tsunami'
    hl: fr
    gl: FR
    ceid: FR:fr
