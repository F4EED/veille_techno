    ceid: FR:fr
    filtre: mots_cles
    domaine: alea_climatique
  - id: li-crise-techno
    label: aléa technologique
    reseaux: [linkedin]
    query: 'Seveso OR Natech OR "accident industriel" OR "aléa technologique" OR "risque technologique" OR nucléaire'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    domaine: alea_technologique
  - id: li-crise-continuite
    label: continuité / PC
    reseaux: [linkedin]
    query: '"continuité d''activité" OR "business continuity" OR "poste de commandement" OR "salle de crise" OR "centre opérationnel"'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    domaine: gestion_crise
  - id: li-crise-en-mgmt
    label: crisis management
    reseaux: [linkedin]
    query: '"crisis management" OR "emergency management" OR "disaster risk reduction" OR "crisis communication"'
    hl: en-US
    gl: US
    ceid: US:en
    filtre: mots_cles
    domaine: gestion_crise
  - id: li-crise-en-disasters
    label: disasters
    reseaux: [linkedin]
    query: 'flood OR earthquake OR wildfire OR hurricane OR "natural disaster" OR "flash flood"'
    hl: en-US
    gl: US
    ceid: US:en
    filtre: mots_cles

mastodon_tags:
