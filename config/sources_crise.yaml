# Sources RSS / Atom pour la veille Gestion de crise.
# Presse nationale et Auvergne-Rhône-Alpes : config/sources_presse.yaml
# Presse régionale France entière (crise) : config/sources_crise_territoires.yaml
# Presse informatique / technique / IA / développement : config/sources_tech.yaml
# (fichiers communs à toutes les veilles, sauf territoires = veilles crise, outils et black-out).

google_news:
  - id: gn-crise-fr
    label: Google News — Gestion de crise (français)
    query: '"gestion de crise" OR crise OR crisis OR crisi'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: gestion_crise
  - id: gn-crise-en
    label: Google News — Gestion de crise (anglais)
    query: '"crisis management" OR crisis OR disaster'
    hl: en-US
    gl: US
    ceid: US:en
    domaine: gestion_crise
  - id: gn-inondations
    label: Google News — Inondations
    query: 'inondation OR inondations OR crue OR "flash flood" OR flooding'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: inondations
  - id: gn-seismes
    label: Google News — Tremblements de terre
    query: '"tremblement de terre" OR séisme OR seisme OR earthquake OR tsunami'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: seismes
  - id: gn-catastrophes
    label: Google News — Catastrophes
    query: 'catastrophe OR catastrophes OR disaster OR "catastrophe naturelle"'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: catastrophes
  - id: gn-alea-climatique
    label: Google News — Aléa climatique
    query: '"aléa climatique" OR "risque climatique" OR canicule OR tempête OR "vent violent" OR tornade OR "trombe marine" OR "chute de neige" OR "coulée de neige" OR "coulée de boue" OR avalanche OR cyclone OR sécheresse OR "feu de forêt"'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: alea_climatique
  - id: gn-alea-techno
    label: Google News — Aléa technologique
    query: '"aléa technologique" OR Seveso OR Natech OR "accident industriel" OR "risque technologique"'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: alea_technologique
  - id: gn-vigilance-meteo
    label: Vigilance Météo-France
    query: 'site:vigilance.meteofrance.fr OR ((site:meteofrance.fr OR site:meteofrance.com) (vigilance OR alerte OR crue OR canicule OR tempête OR vent OR tornade OR neige OR avalanche OR orage))'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: alea_climatique
    site: https://vigilance.meteofrance.fr/fr

requetes_rs:
  - id: crise-fr
    label: Gestion de crise (français)
    query: '"gestion de crise" OR inondation OR séisme OR catastrophe OR tempête OR tornade OR avalanche OR neige OR "aléa climatique" OR "aléa technologique" OR crisis'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
