# Sources RSS / Atom pour la veille Radio.
# Presse nationale et Auvergne-Rhône-Alpes : config/sources_presse.yaml
# Presse informatique / technique / IA / développement : config/sources_tech.yaml
# (fichiers communs à toutes les veilles).

google_news:
  - id: gn-radioamateur-fr
    label: Google News — Radioamateur (français)
    query: 'radioamateur OR "radio amateur" OR hamradio OR "ham radio" OR radiomateur'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: radioamateur
  - id: gn-radioamateur-en
    label: Google News — Radioamateur (anglais)
    query: '"amateur radio" OR "ham radio" OR hamradio OR ARRL'
    hl: en-US
    gl: US
    ceid: US:en
    domaine: radioamateur
  - id: gn-modes-digitaux
    label: Google News — Modes digitaux
    query: 'FT8 OR JS8Call OR Winlink OR VARA OR "digital modes" OR "modes digitaux" OR DMR OR "D-STAR" OR C4FM'
    hl: en-US
    gl: US
    ceid: US:en
    domaine: modes_digitaux
  - id: gn-trafic-radio
    label: Google News — Trafic radio
    query: '"trafic radio" OR (trafic AND (radioamateur OR "ham radio" OR PMR OR TETRA)) OR "emergency net" OR ARES'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: trafic
  - id: gn-radio-pro
    label: Google News — Radio professionnelle
    query: '"radio professionnelle" OR TETRA OR PMR OR DMR OR "réseau radio"'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: radio_pro
  - id: gn-sdr
    label: Google News — SDR / APRS
    query: 'SDR OR "software defined radio" OR APRS OR "RTL-SDR" OR WebSDR'
    hl: en-US
    gl: US
    ceid: US:en
    domaine: sdr_aprs

requetes_rs:
  - id: radio-fr
    label: Radio (français)
    query: 'radioamateur OR "radio amateur" OR hamradio OR "ham radio" OR "trafic radio" OR "modes digitaux" OR TETRA OR PMR'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
  - id: radio-en
    label: Radio (anglais)
    query: '"amateur radio" OR "ham radio" OR hamradio OR DMR OR TETRA OR "digital modes" OR SDR OR APRS'
    hl: en-US
    gl: US
    ceid: US:en
    filtre: mots_cles

mastodon_tags:
  - HamRadio
  - AmateurRadio
  - FT8
  - APRS
  - SDR

