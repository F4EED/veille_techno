      - "emergency net"
      - "réseau d'urgence"
      - ares
      - races
      - "message handling"

  radio_pro:
    label: Radio professionnelle
    priorite: 80
    mots_cles:
      - radio
      - "radio professionnelle"
      - "réseau radio"
      - "reseau radio"
      - "poste radio"
      - pmr
      - tetra
      - dmr
      - "two-way radio"
      - "land mobile"

  sdr_aprs:
    label: SDR, APRS & relais
    priorite: 75
    mots_cles:
      - sdr
      - "software defined radio"
      - aprs
      - relais
      - repeater
      - "hotspot radio"
      - "rtl-sdr"
      - rtlsdr
      - websdr
      - "qo-100"
      - "qo100"

  hf_vhf:
    label: HF / VHF / UHF
    priorite: 70
    mots_cles:
      - "ondes courtes"
      - shortwave
      - hf
      - vhf
      - uhf
      - shf
      - "bande amateur"
      - "propagation hf"
      - "sunspot"
      - "indice solaire"

tendances:
  - id: hamradio
    label: Radioamateur
    mots_cles: [radioamateur, hamradio, "ham radio", "amateur radio"]
  - id: modes_digitaux
    label: Modes digitaux
    mots_cles: [ft8, js8, winlink, dmr, "d-star", "modes digitaux", vara]
  - id: trafic
    label: Trafic radio
    mots_cles: [trafic, "trafic radio", "net control", ares]
  - id: radio_pro
    label: Radio professionnelle
    mots_cles: [pmr, tetra, dmr, "radio professionnelle"]
  - id: sdr
    label: SDR et APRS
    mots_cles: [sdr, aprs, "rtl-sdr", repeater, relais]
