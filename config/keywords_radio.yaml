# Veille Radio / radioamateur

periode_jours: 7

domaines:
  radioamateur:
    label: Radioamateur
    priorite: 100
    mots_cles:
      - radioamateur
      - "radio amateur"
      - "radio-amateur"
      - radiomateur
      - hamradio
      - "ham radio"
      - "ham-radio"
      - "amateur radio"
      - om
      - yagi
      - qso
      - qsl
      - iaru
      - arrl
      - "réseau des émetteurs"
      - "indicatif radio"

  modes_digitaux:
    label: Modes digitaux
    priorite: 90
    mots_cles:
      - "modes digitaux"
      - "mode digital"
      - "digital modes"
      - "digital mode"
      - ft8
      - ft4
      - js8
      - js8call
      - psk31
      - rtty
      - varac
      - vara
      - winlink
      - "packet radio"
      - ax25
      - "ax.25"
      - dstar
      - "d-star"
      - c4fm
      - fusion
      - codec2
      - freedv

  trafic:
    label: Trafic
    priorite: 85
    mots_cles:
      - trafic
      - "trafic radio"
      - "radio traffic"
      - "traffic net"
      - "net control"
      - "réseau de trafic"
