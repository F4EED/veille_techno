# Réseaux sociaux suivis pour toutes les veilles.
# Chaque profil définit ses requêtes (requetes_rs) et hashtags Mastodon (mastodon_tags).

reseaux:
  - id: linkedin
    label: LinkedIn
    sites: [linkedin.com]
    url: https://www.linkedin.com/
  - id: x
    label: X
    sites: [x.com, twitter.com]
    url: https://x.com/
  - id: mastodon
    label: Mastodon
    sites:
      - mastodon.social
      - piaille.fr
      - mamot.fr
      - fosstodon.org
