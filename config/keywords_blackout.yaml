# Veille Black-out — France, déclarations de l'exécutif, réseau électrique.
# Les alias (FR/EN, avec/sans accents) sont normalisés à l'exécution.
# « emmanuel macron » n'est pas un mot-clé d'inclusion : il noierait le rapport.
# Ses prises de parole récentes arrivent par le flux Élysée et les requêtes
# Google News dédiées ; les articles de presse qui le citent sur ce thème
# sont étiquetés par la tendance « macron ».

