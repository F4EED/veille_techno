# Presse nationale informatique, technique, IA et développement.
# Commune à toutes les veilles. filtre: mots_cles → match du fichier keywords du profil.

google_news:
  - id: gn-presse-it
    label: Google News — presse informatique
    query: 'site:journaldunet.com OR site:usine-digitale.fr OR site:usinenouvelle.com OR site:lemagit.fr OR site:itforbusiness.fr OR site:channelnews.fr OR site:cio-online.com'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    site: https://www.journaldunet.com/
  - id: gn-presse-ia
    label: Google News — IA / data
    query: 'site:actuia.com OR site:lebigdata.fr OR site:siecledigital.fr OR site:frenchweb.fr OR site:maddyness.com OR site:linformaticien.com'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    site: https://www.actuia.com/
  - id: gn-presse-tech-recherche
    label: Google News — recherche / ingénierie
    query: 'site:inria.fr OR site:hellofuture.orange.com OR site:polytechnique-insights.com OR site:industrie-techno.com OR site:alliancy.fr OR site:hardware.fr OR site:lemagit.fr'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    site: https://www.inria.fr/

