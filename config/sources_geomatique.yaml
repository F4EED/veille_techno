# Sources RSS / Atom pour la veille Géomatique.
# Presse nationale et Auvergne-Rhône-Alpes : config/sources_presse.yaml
# Presse informatique / technique / IA / développement : config/sources_tech.yaml
# Découvertes de chaque lancement : config/sources_decouvertes_geomatique.yaml
# et config/sources_auto.yaml (communes à toutes les veilles).
# Le flux RSS public du BRGM (https://www.brgm.fr/fr/rss/actualites.xml) répond
# en XML mais ne contient aucun article : le BRGM est suivi via Google News.

google_news:
  - id: gn-geomatique-fr
    label: Google News — Géomatique
    query: 'géomatique OR géomaticien OR géomaticienne OR "information géographique" OR "information géolocalisée" OR géoportail OR géoplateforme OR Geotribu OR Afigéo'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: geomatique
  - id: gn-qgis-outils
    label: Google News — QGIS et outils de cartographie
    query: 'QGIS OR PostGIS OR GeoServer OR "GRASS GIS" OR GDAL OR "outils géomatiques" OR "outils de géomatique" OR "outil géomatique" OR "outils de cartographie" OR "logiciel de cartographie" OR "logiciel SIG"'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: outils
  - id: gn-carto-donnees
    label: Google News — Données cartographiques
    query: '"données géographiques" OR "données géospatiales" OR "données cartographiques" OR "base adresse nationale" OR "plan cadastral" OR "BD TOPO" OR "BD ORTHO" OR "modèle numérique de terrain"'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: donnees
  - id: gn-geoai
    label: Google News — IA géomatique
    query: 'GeoAI OR "geospatial AI" OR "IA géospatiale" OR "IA géomatique" OR ("intelligence artificielle" AND (géomatique OR QGIS OR cartographie OR "données géographiques" OR télédétection))'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: ia
  - id: gn-gis-en
    label: Google News — GIS, QGIS, geospatial
    query: 'QGIS OR PostGIS OR "geographic information system" OR "geospatial data" OR "web mapping" OR GeoAI OR "geospatial AI" OR "open source GIS"'
    hl: en-US
    gl: US
    ceid: US:en
    domaine: geomatique
  - id: gn-ign
    label: Google News — IGN
    query: 'site:ign.fr'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: geomatique
  - id: gn-osm
    label: Google News — OpenStreetMap
    query: 'site:openstreetmap.org OR site:openstreetmap.fr OR site:weeklyosm.eu'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: geomatique
  - id: gn-brgm
    label: Google News — BRGM
    query: 'site:brgm.fr'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: geomatique
  - id: gn-craig
    label: Google News — CRAIG
    query: 'site:www.craig.fr OR site:ids.craig.fr OR site:craig.fr'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: geomatique
  - id: gn-portails-geo
    label: Google News — Géoportail, Géoplateforme, Géorisques, SHOM
    query: 'site:geoportail.gouv.fr OR site:cartes.gouv.fr OR site:geoportail-urbanisme.gouv.fr OR site:georisques.gouv.fr OR site:shom.fr OR site:cnig.gouv.fr'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: geomatique
  - id: gn-presse-geo
    label: Google News — Presse géomatique
    query: 'site:geotribu.fr OR site:afigeo.asso.fr OR site:georezo.net OR site:sigmag.fr OR site:decryptageo.fr OR site:esrifrance.fr OR site:neogeo.fr OR site:oslandia.com'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: geomatique
  - id: gn-carto-urgence
    label: Google News — Cartographie d'urgence et de crise
    query: '"cartographie d''urgence" OR "cartographie de crise" OR "cartographie humanitaire" OR "crisis mapping" OR "emergency mapping" OR "humanitarian mapping" OR "rapid mapping" OR CartONG OR MapAction OR "Missing Maps" OR UNOSAT OR "Copernicus EMS"'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: urgence
  - id: gn-lidar-aerien
    label: Google News — Lidar et prises de vue aériennes
    query: 'lidar OR "lidar aéroporté" OR "airborne lidar" OR "aerial lidar" OR "nuage de points"'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: lidar
  - id: gn-releves
    label: Google News — Relevés et prises de vue aériennes
    query: '"relevé topographique" OR "levé topographique" OR "prise de vue aérienne" OR "prises de vue aériennes" OR "imagerie aérienne" OR photogrammétrie OR orthophoto OR "levé par drone" OR "mobile mapping" OR "aerial survey"'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: releves
  - id: gn-carto-urgence-orgs
    label: Google News — HOT, Missing Maps, Copernicus EMS
    query: 'site:hotosm.org OR site:missingmaps.org OR site:emergency.copernicus.eu OR site:unosat.org OR site:cartong.org OR site:mapaction.org'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: urgence
  - id: gn-opendata-geo
    label: Google News — Open data géographique
    query: '("open data" OR "données ouvertes" OR opendata OR "licence ouverte") (cartographie OR géomatique OR SIG OR "données géographiques" OR adresse OR cadastre OR IGN OR SDIS OR QGIS OR lidar)'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: donnees
  - id: gn-sdis-carto
    label: Google News — Cartographie et open data des SDIS
    query: '(SDIS OR SDMIS OR "sapeurs-pompiers" OR ENSOSP) (cartographie OR SIG OR géomatique OR "open data" OR "données ouvertes" OR lidar OR QGIS OR "point d''eau incendie" OR "prise de vue aérienne")'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: urgence
  - id: gn-portails-opendata
    label: Google News — data.gouv.fr, Etalab, DINUM
    query: '(site:data.gouv.fr OR site:etalab.gouv.fr OR site:opendatafrance.fr OR site:numerique.gouv.fr OR site:adresse.data.gouv.fr OR site:transport.data.gouv.fr OR site:ensosp.fr OR site:pompiers.fr) (cartographie OR géomatique OR "données géographiques" OR "open data" OR "données ouvertes" OR SDIS OR cadastre OR adresse)'
    hl: fr
    gl: FR
    ceid: FR:fr
    domaine: donnees

