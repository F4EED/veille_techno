# Veille crise : médias nationaux d'alerte et presse régionale de toute la France.
# (L'AURA déjà dans sources_presse.yaml n'est pas recopiée.)

google_news:
  - id: gn-interieur-sgdsn
    label: Intérieur / SGDSN / gouvernement
    query: 'site:interieur.gouv.fr OR site:gouvernement.fr OR site:sgdsn.gouv.fr OR site:securite-civile.gouv.fr'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    site: https://www.interieur.gouv.fr/
  - id: gn-pqr-ouest
    label: Google News — PQR Ouest
    query: 'site:ouest-france.fr OR site:letelegramme.fr OR site:lanouvellerepublique.fr OR site:presseocean.fr OR site:lecourrierdelouest.fr'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    site: https://www.ouest-france.fr/
  - id: gn-pqr-nord
    label: Google News — PQR Nord / Picardie
    query: 'site:lavoixdunord.fr OR site:nordeclair.fr OR site:courrier-picard.fr OR site:lunion.fr OR site:lardennais.fr'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    site: https://www.lavoixdunord.fr/
  - id: gn-pqr-est
    label: Google News — PQR Est
    query: 'site:estrepublicain.fr OR site:republicain-lorrain.fr OR site:dna.fr OR site:lalsace.fr OR site:bienpublic.com OR site:lejsl.com'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    site: https://www.estrepublicain.fr/
  - id: gn-pqr-sud-ouest
    label: Google News — PQR Sud-Ouest
    query: 'site:sudouest.fr OR site:charentelibre.fr OR site:larepubliquedespyrenees.fr OR site:nrpyrenees.fr'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    site: https://www.sudouest.fr/
  - id: gn-pqr-occitanie-paca
    label: Google News — PQR Occitanie / PACA
    query: 'site:ladepeche.fr OR site:midilibre.fr OR site:laprovence.com OR site:nicematin.com OR site:varmatin.com OR site:corsematin.com'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    site: https://www.ladepeche.fr/
  - id: gn-pqr-centre-normandie
    label: Google News — PQR Centre / Normandie
    query: 'site:lyonne.fr OR site:leberry.fr OR site:larep.fr OR site:paris-normandie.fr OR site:tendanceouest.com'
    hl: fr
    gl: FR
    ceid: FR:fr
    filtre: mots_cles
    site: https://www.paris-normandie.fr/

