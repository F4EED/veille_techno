tendances:
  - id: lora_mesh_opensource
    label: Maillage LoRa libre (Meshtastic / Meshcore)
    mots_cles: [meshtastic, meshcore, "lora mesh"]
  - id: reseaux_lorawan_territoires
    label: Réseaux LoRaWAN territoriaux / collectivités
    mots_cles: [lorawan, collectivité, collectivite, département, departement, "smart city", "territoire connecté"]
  - id: viabilite_hivernale_iot
    label: Viabilité hivernale & capteurs de chaussée
    mots_cles: [rwis, "météo routière", verglas, chaussée, chaussee, "viabilité hivernale"]
  - id: gestion_routiere
    label: Gestion routière & routes
    mots_cles: [routes, "gestion routière", voirie, "exploitation routière"]
  - id: crise_exploitation
    label: Gestion de crise
    mots_cles: [crise, "gestion de crise", orsec, "cellule de crise"]
  - id: main_courante
    label: Main courante
    mots_cles: ["main courante", "main-courante", "incident log"]
  - id: radio_pro
    label: Radio professionnelle (PMR, TETRA, DMR)
    mots_cles: [radio, pmr, tetra, dmr, "réseau radio"]
  - id: iiot_cyber_ot
    label: IIoT, usine connectée et cybersécurité OT
    mots_cles: [iiot, "industrie 4.0", "cybersécurité ot", scada, "usine connectée"]
  - id: lpwan_5g_redcap
    label: LPWAN, NB-IoT, LTE-M et 5G RedCap
    mots_cles: [lpwan, "nb-iot", "lte-m", redcap, 5g, sigfox]
  - id: matter_thread_maison
    label: Matter / Thread et maison connectée
    mots_cles: [matter, thread, zigbee, "smart home", "maison connectée"]
  - id: edge_ia_capteurs
    label: IA embarquée et capteurs intelligents
    mots_cles: ["edge ai", "edge computing", "tiny ml", tinyml, capteur]
  - id: helium_decentralise
    label: Réseaux décentralisés (Helium, réseaux communautaires)
    mots_cles: [helium, "community network", "réseau communautaire"]
